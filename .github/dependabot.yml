version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/Jellyfin.Plugin.AchievementBadges"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # Jellyfin SDK is pinned exactly in the csproj — upgrades require a
      # manual ABI check against the target Jellyfin release.
      - dependency-name: "Jellyfin.Controller"
      - dependency-name: "Jellyfin.Model"

  - package-ecosystem: "nuget"
    directory: "/Jellyfin.Plugin.AchievementBadges.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "tests"
    commit-message:
      prefix: "deps(tests)"
    ignore:
      # The Jellyfin package line is chosen per target framework in the
      # csproj (10.11.x on net9.0, 12.x on net10.0) and doubles as the
      # plugin's minimum server version. Dependabot has bumped it through
      # this entry too (#101, #104); keep every entry aligned.
      - dependency-name: "Jellyfin.Controller"
      - dependency-name: "Jellyfin.Model"

  - package-ecosystem: "nuget"
    directory: "/Jellyfin.Plugin.AchievementBadges.Fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "fuzz"
    commit-message:
      prefix: "deps(fuzz)"
    ignore:
      # The Jellyfin package line is chosen per target framework in the
      # csproj (10.11.x on net9.0, 12.x on net10.0) and doubles as the
      # plugin's minimum server version. Dependabot has bumped it through
      # this entry too (#101, #104); keep every entry aligned.
      - dependency-name: "Jellyfin.Controller"
      - dependency-name: "Jellyfin.Model"

  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
      - "fuzz"
    commit-message:
      prefix: "deps(fuzz-docker)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
